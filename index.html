<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LiftLeague — Train. Track. Rank.</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#0b0d14;--surface:#141827;--surface2:#20263a;--ink:#f4f6ff;--muted:#9ba6bf;--line:#2e354a;--accent:#a7f36b;--purple:#a78bfa;--red:#ff808a}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{max-width:720px;margin:auto;padding:18px 16px 104px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--accent)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800;color:var(--accent)}h1{font-size:30px;line-height:1.12;letter-spacing:-1.1px;margin:8px 0 10px}h2{font-size:19px;letter-spacing:-.4px;margin:0 0 12px}h3{margin:0 0 10px;font-size:16px}p{color:var(--muted);margin:5px 0 14px}.card{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:14px}.hero{background:linear-gradient(125deg,#26304b,#151927 65%);border-color:#364260}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;background:var(--accent);color:#11180e;padding:11px 15px;font-weight:850;min-height:42px}.btn.secondary{background:var(--surface2);color:var(--ink)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.btn.danger{color:var(--red);background:#3a1f2b}.btn.small{padding:6px 10px;min-height:34px;font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:5px 10px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700}.pill.green{color:var(--accent);background:#283b25}.muted,small{color:var(--muted)}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:var(--surface2);padding:13px;border-radius:13px}.stat b{display:block;font-size:19px}.stat small{font-size:11px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}.section-head h2{margin:0}.list{display:grid;gap:9px}.item{padding:13px;background:var(--surface2);border-radius:12px}.item b{display:block}.item small{display:block;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;font-weight:750;color:var(--muted)}input,select{width:100%;min-width:0;background:#0e1220;color:var(--ink);border:1px solid #384056;border-radius:11px;padding:11px 12px}input::placeholder{color:#65708a}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 8px max(9px,env(safe-area-inset-bottom));background:#121625ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}.nav-inner{display:grid;grid-template-columns:repeat(4,1fr);width:min(700px,100%);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:12px;font-weight:700;font-size:12px}.nav button.active{background:#2b362a;color:var(--accent)}.nav button span{display:block;font-size:21px}.hidden{display:none!important}.rule{height:1px;background:var(--line);margin:14px 0}.empty{text-align:center;padding:25px 12px;color:var(--muted)}.rank{text-align:center;font-weight:900;font-size:31px;letter-spacing:-1px}.rank-sub{text-align:center;color:var(--muted)}.progress{height:10px;border-radius:10px;background:#323950;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--purple),var(--accent));border-radius:10px}.set-row{display:grid;grid-template-columns:26px 1fr 1fr 48px;align-items:end;gap:8px;margin:8px 0}.set-row input{padding:8px}.set-row .btn{min-height:38px}.workout-ex{padding:12px 0;border-top:1px solid var(--line)}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:11px 17px;background:var(--accent);color:#14200c;border-radius:14px;font-weight:800;z-index:30;white-space:nowrap;max-width:95%;text-align:center}.hint{font-size:12px;color:var(--muted)}.light{color:var(--accent)}@media(min-width:650px){.app{padding:32px 24px 110px}h1{font-size:40px}}@media(max-width:380px){.card{padding:14px}.stat{padding:9px}.stat b{font-size:16px}.btn{padding:9px 10px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="logo">⚡ Lift<span>League</span></div><span class="pill">TRAIN • TRACK • RANK</span></header>
<section id="view-home"></section><section id="view-plans" class="hidden"></section><section id="view-ranks" class="hidden"></section><section id="view-profile" class="hidden"></section>
</main>
<nav class="nav" aria-label="Main navigation"><div class="nav-inner"><button data-tab="home" class="active"><span>⌂</span>Home</button><button data-tab="plans"><span>▦</span>Plans</button><button data-tab="ranks"><span>◆</span>Ranks</button><button data-tab="profile"><span>◉</span>Profile</button></div></nav><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='liftleague-v1',exercises=['Bench Press','Squat','Deadlift','Overhead Press','Barbell Row','Incline Bench Press','Pull-up (Weighted)','Dumbbell Bench Press','Leg Press','Lat Pulldown','Bicep Curl','Tricep Pushdown','Other'];
const samplePlans=[{id:'push',name:'Push Day',exercises:[{id:'bench',name:'Bench Press',sets:3,reps:8},{id:'ohp',name:'Overhead Press',sets:3,reps:10},{id:'incline',name:'Incline Bench Press',sets:3,reps:10}]},{id:'pull',name:'Pull Day',exercises:[{id:'dead',name:'Deadlift',sets:3,reps:5},{id:'row',name:'Barbell Row',sets:3,reps:8},{id:'curl',name:'Bicep Curl',sets:3,reps:12}]},{id:'legs',name:'Leg Day',exercises:[{id:'squat',name:'Squat',sets:3,reps:8},{id:'legpress',name:'Leg Press',sets:3,reps:12}]}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.plans)||!Array.isArray(state.logs)){state={profile:{name:'Athlete',height:175,bodyweight:75},plans:samplePlans,logs:[],unit:'kg',session:null}}let tab='home';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=v=>Number(v)||0,id=()=>Math.random().toString(36).slice(2,10),fmt=x=>Number(x).toLocaleString(undefined,{maximumFractionDigits:1}),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Storage full. Export your data.')}},dateFmt=v=>new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),convert=w=>state.unit==='lb'?w*2.2046226218:w,fromDisplay=w=>state.unit==='lb'?w/2.2046226218:w;
function toast(m){const el=$('toast');el.textContent=m;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2300)}
function metric(){const logs=state.logs;let volume=0,bests={};for(const l of logs){for(const e of l.exercises){for(const s of e.sets){volume+=s.weight*s.reps;if(s.reps>=1&&s.weight>0){const rm=s.weight*(1+Math.min(s.reps,12)/30);bests[e.name]=Math.max(bests[e.name]||0,rm)}}}}return {volume,bests}}
function rankInfo(){const {bests}=metric(),bw=n(state.profile.bodyweight),height=n(state.profile.height);const major=['Bench Press','Squat','Deadlift'];let total=0,count=0;for(const key of major){if(bests[key]>0){total+=bests[key];count++}}// Epley e1RM in kg, normalized by BW^0.67. Height gives modest (max ±5%) modifier, not used as a sole proxy for strength.
const normalized=bw>0&&count>0?(total/count)/Math.pow(bw,.67)*Math.max(.95,Math.min(1.05,Math.pow(height/175,.15))):0;const tiers=[{name:'Unranked',min:0},{name:'Rookie',min:.7},{name:'Bronze',min:1.2},{name:'Silver',min:1.8},{name:'Gold',min:2.5},{name:'Platinum',min:3.2},{name:'Diamond',min:4},{name:'Titan',min:5}];let index=0;for(let i=1;i<tiers.length;i++)if(normalized>=tiers[i].min)index=i;const next=tiers[index+1];const prev=tiers[index];return{normalized,rank:count?prev.name:'Unranked',next:next?.name||'Max rank',pct:count?next?100*(normalized-prev.min)/(next.min-prev.min):100:0,count,bench:bests['Bench Press']||0,squat:bests['Squat']||0,dead:bests['Deadlift']||0}}
function render(){['home','plans','ranks','profile'].forEach(x=>$('view-'+x).classList.toggle('hidden',x!==tab));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home:home,plans:plans,ranks:ranks,profile:profile})[tab]();}
function switchTab(x){tab=x;render();window.scrollTo({top:0,behavior:'smooth'})}
function home(){const m=metric(),r=rankInfo();$('view-home').innerHTML=`<div class="eyebrow">Your training headquarters</div><h1>Stronger every day<span class="light">.</span></h1><p>Welcome back, ${esc(state.profile.name||'Athlete')}. Your next rep starts here.</p><div class="card hero"><div class="flex between"><div><div class="eyebrow">Current rank</div><h1>${r.rank} ${r.rank!=='Unranked'?'◆':''}</h1><p>${r.count} of 3 core lifts logged</p></div><button class="btn secondary" data-action="go-ranks">View ranks →</button></div><div class="progress"><div style="width:${Math.max(0,Math.min(100,r.pct))}%"></div></div><small>${r.count?r.next==='Max rank'?'Top tier reached':fmt(r.pct)+'% toward '+r.next:'Log bench, squat, or deadlift to get ranked'}</small></div><div class="stat-row"><div class="stat"><b>${state.logs.length}</b><small>Sessions</small></div><div class="stat"><b>${fmt(convert(m.volume))}</b><small>${state.unit} volume</small></div><div class="stat"><b>${state.plans.length}</b><small>Plans</small></div></div><div class="section-head"><h2>Start a workout</h2><button class="btn small secondary" data-action="go-plans">All plans</button></div><div class="list">${state.plans.map(p=>`<div class="item flex between"><div class="grow"><b>${esc(p.name)}</b><small>${p.exercises.length} exercises</small></div><button class="btn small" data-action="start" data-id="${esc(p.id)}">Start ↗</button></div>`).join('')||'<div class="empty">Make your first plan in the Plans tab.</div>'}</div><div class="section-head"><h2>Recent activity</h2></div><div class="list">${state.logs.slice().reverse().slice(0,3).map(l=>`<div class="item"><b>${esc(l.planName)}</b><small>${dateFmt(l.date)} · ${l.exercises.reduce((a,e)=>a+e.sets.length,0)} sets</small></div>`).join('')||'<div class="empty">No workouts yet. Complete your first session!</div>'}</div>`}
function plans(){const el=$('view-plans');el.innerHTML=`<div class="eyebrow">Build your routine</div><h1>Workout plans</h1><p>Customize exercises, sets, and rep targets. Start any plan whenever you're ready.</p><div class="card"><h3>Create new plan</h3><div class="flex"><input id="new-plan-name" class="grow" placeholder="e.g. Upper Body A" maxlength="60"><button class="btn" data-action="add-plan">Create +</button></div></div>${state.session?sessionHTML():''}<div class="section-head"><h2>Saved plans</h2><span class="pill">${state.plans.length} plans</span></div>${state.plans.map(p=>`<div class="card"><div class="flex between"><h3>${esc(p.name)}</h3><div class="flex"><button class="btn small secondary" data-action="start" data-id="${esc(p.id)}">Start</button><button class="btn small ghost" data-action="delete-plan" data-id="${esc(p.id)}">Delete</button></div></div><div class="list">${p.exercises.map(e=>`<div class="item flex between"><div class="grow"><b>${esc(e.name)}</b><small>${e.sets} sets × ${e.reps} reps</small></div><button class="btn small ghost" data-action="remove-ex" data-plan="${esc(p.id)}" data-id="${esc(e.id)}" aria-label="Remove exercise">✕</button></div>`).join('')||'<div class="empty">Add an exercise below.</div>'}</div><div class="rule"></div><div class="grid"><div class="field"><label>Exercise</label><select id="ex-${esc(p.id)}">${exercises.map(e=>`<option>${esc(e)}</option>`).join('')}</select></div><div class="field"><label>Custom name (optional)</label><input id="custom-${esc(p.id)}" placeholder="Any exercise" maxlength="70"></div><div class="field"><label>Sets</label><input id="sets-${esc(p.id)}" type="number" min="1" max="20" value="3"></div><div class="field"><label>Target reps</label><input id="reps-${esc(p.id)}" type="number" min="1" max="100" value="8"></div></div><button class="btn secondary" data-action="add-ex" data-id="${esc(p.id)}">+ Add exercise</button></div>`).join('')||'<div class="empty">No plans yet.</div>'}`}
function sessionHTML(){const s=state.session;return`<div class="card hero" id="session"><div class="eyebrow">Workout in progress</div><h2>${esc(s.planName)}</h2><p>Enter weight in ${state.unit} and completed reps for each set.</p>${s.exercises.map((e,ei)=>`<div class="workout-ex"><h3>${esc(e.name)}</h3>${e.sets.map((set,si)=>`<div class="set-row"><strong>${si+1}</strong><div class="field"><label>Weight (${state.unit})</label><input type="number" min="0" max="2000" step="0.5" inputmode="decimal" data-weight="${ei}:${si}" value="${set.weight?fmt(convert(set.weight)):''}" placeholder="0"></div><div class="field"><label>Reps</label><input type="number" min="0" max="100" inputmode="numeric" data-reps="${ei}:${si}" value="${set.reps||''}" placeholder="${e.targetReps}"></div><span class="pill">Set</span></div>`).join('')}</div>`).join('')}<div class="flex"><button class="btn" data-action="finish">✓ Finish workout</button><button class="btn ghost" data-action="cancel-session">Discard</button></div></div>`}
function ranks(){const r=rankInfo(),m=metric();$('view-ranks').innerHTML=`<div class="eyebrow">Lift • Level • Repeat</div><h1>Your strength rank</h1><div class="card hero"><div class="eyebrow" style="text-align:center">Current tier</div><div class="rank">◆ ${r.rank}</div><div class="rank-sub">${r.count}/3 competition lifts recorded</div><div class="progress"><div style="width:${Math.max(0,Math.min(r.pct,100))}%"></div></div><div class="flex between"><small>Score: ${fmt(r.normalized)}</small><small>Next: ${r.next}</small></div></div><div class="card"><h2>Your estimated one-rep max</h2><div class="list">${[['Bench Press',r.bench],['Squat',r.squat],['Deadlift',r.dead]].map(([name,val])=>`<div class="item flex between"><b>${name}</b><b>${val?fmt(convert(val))+' '+state.unit:'Not logged'}</b></div>`).join('')}</div><p class="hint" style="margin-top:12px">Estimated 1RM uses your best recorded set (Epley formula, reps capped at 12). Only these three lifts count toward rank.</p></div><div class="card"><h2>How ranking works</h2><p>Rank score = average estimated 1RM of your logged competition lifts ÷ bodyweight<sup>0.67</sup>, with a modest height adjustment (at most ±5%). All weights are calculated in kg.</p><p>Progress is based on your own logged performance. Height is included, but height alone isn't a reliable measure of strength.</p><div class="list">${[['Rookie',.7],['Bronze',1.2],['Silver',1.8],['Gold',2.5],['Platinum',3.2],['Diamond',4],['Titan',5]].map(([t,s])=>`<div class="item flex between"><b>${t}</b><span class="pill">Score ${s}+</span></div>`).join('')}</div><p class="hint" style="margin-top:12px">These are in-app achievement thresholds, not scientific strength standards or an online leaderboard.</p></div><div class="card"><h2>Other personal records</h2>${Object.entries(m.bests).sort((a,b)=>b[1]-a[1]).map(([e,v])=>`<div class="item flex between" style="margin-bottom:6px"><span>${esc(e)}</span><b>${fmt(convert(v))} ${state.unit}</b></div>`).join('')||'<div class="empty">Your PRs will appear after logging workouts.</div>'}</div>`}
function profile(){$('view-profile').innerHTML=`<div class="eyebrow">Athlete details</div><h1>My profile</h1><p>Bodyweight and height shape your ranking. Your workout data stays on this device unless exported.</p><form id="profile-form" class="card"><div class="field"><label>Name</label><input name="name" maxlength="60" required value="${esc(state.profile.name)}"></div><div class="grid"><div class="field"><label>Height (cm)</label><input name="height" type="number" min="100" max="250" required step="0.1" value="${n(state.profile.height)}"></div><div class="field"><label>Bodyweight (kg)</label><input name="bodyweight" type="number" min="20" max="400" required step="0.1" value="${n(state.profile.bodyweight)}"></div></div><div class="field"><label>Workout weight units</label><select name="unit"><option value="kg" ${state.unit==='kg'?'selected':''}>Kilograms (kg)</option><option value="lb" ${state.unit==='lb'?'selected':''}>Pounds (lb)</option></select></div><button class="btn" type="submit">Save profile</button></form><div class="card"><h2>My data</h2><p>Export backups to a JSON file, or restore previously exported data. Clearing browser storage will erase unexported progress.</p><div class="flex"><button class="btn secondary" data-action="export">↓ Export backup</button><label class="btn secondary" for="import-file">↑ Import backup</label><input id="import-file" type="file" accept="application/json,.json" class="hidden"></div><div class="rule"></div><button class="btn danger" data-action="reset">Reset all data</button></div><div class="card"><h2>Phone install</h2><p>After hosting this app over HTTPS, open it in your phone browser and choose <b>Add to Home Screen</b>. On Android, Chrome may offer <b>Install app</b>.</p></div>`}
function startPlan(planId){const p=state.plans.find(p=>p.id===planId);if(!p)return;if(state.session&&!confirm('Replace your unfinished session?'))return;state.session={id:id(),planName:p.name,date:new Date().toISOString(),exercises:p.exercises.map(e=>({name:e.name,targetReps:e.reps,sets:Array.from({length:e.sets},()=>({weight:0,reps:0}))}))};save();switchTab('plans');toast('Workout started!')}
function syncInputs(){if(!state.session)return;document.querySelectorAll('[data-weight]').forEach(el=>{const[ei,si]=el.dataset.weight.split(':').map(Number);state.session.exercises[ei].sets[si].weight=fromDisplay(n(el.value))});document.querySelectorAll('[data-reps]').forEach(el=>{const[ei,si]=el.dataset.reps.split(':').map(Number);state.session.exercises[ei].sets[si].reps=Math.max(0,Math.floor(n(el.value)))});save()}
function action(a,b){const x=a.dataset.action,idv=a.dataset.id,p=state.plans.find(p=>p.id===idv);switch(x){case'go-plans':switchTab('plans');break;case'go-ranks':switchTab('ranks');break;case'start':startPlan(idv);break;case'add-plan':{const input=$('new-plan-name'),name=input?.value.trim();if(!name){toast('Enter a plan name');break}state.plans.push({id:id(),name,exercises:[]});save();render();toast('Plan created');break}case'delete-plan':if(confirm('Delete this workout plan?')){state.plans=state.plans.filter(p=>p.id!==idv);save();render()}break;case'add-ex':{if(!p)return;const name=($('custom-'+idv).value.trim()||$('ex-'+idv).value),sets=n($('sets-'+idv).value),reps=n($('reps-'+idv).value);if(!name||sets<1||sets>20||reps<1||reps>100){toast('Enter valid exercise, sets and reps');return}p.exercises.push({id:id(),name,sets,reps});save();render();toast('Exercise added');break}case'remove-ex':{const plan=state.plans.find(p=>p.id===a.dataset.plan);if(plan){plan.exercises=plan.exercises.filter(e=>e.id!==idv);save();render()}break}case'finish':{syncInputs();const s=state.session;if(!s)return;const clean={id:s.id,date:new Date().toISOString(),planName:s.planName,exercises:s.exercises.map(e=>({name:e.name,sets:e.sets.filter(t=>t.reps>0&&t.weight>=0)})).filter(e=>e.sets.length)};if(!clean.exercises.length){toast('Log at least one completed set');return}state.logs.push(clean);state.session=null;save();switchTab('home');toast('Workout saved!');break}case'cancel-session':if(confirm('Discard this workout?')){state.session=null;save();render()}break;case'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='liftleague-backup-'+new Date().toISOString().slice(0,10)+'.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'reset':if(confirm('Erase ALL plans, workouts and progress? This cannot be undone.')){localStorage.removeItem(KEY);location.reload()}break}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){if(state.session&&tab==='plans')syncInputs();switchTab(nav.dataset.tab);return}const btn=e.target.closest('[data-action]');if(btn)action(btn)});document.addEventListener('input',e=>{if(e.target.matches('[data-weight],[data-reps]'))syncInputs()});document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();const fd=new FormData(e.target),height=n(fd.get('height')),bw=n(fd.get('bodyweight'));if(height<100||height>250||bw<20||bw>400){toast('Check height and bodyweight');return}state.profile={name:String(fd.get('name')).trim()||'Athlete',height,bodyweight:bw};state.unit=fd.get('unit')==='lb'?'lb':'kg';save();render();toast('Profile updated')}});document.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.plans)||!Array.isArray(data.logs)||!data.profile||!['kg','lb'].includes(data.unit))throw Error('Invalid backup');if(!confirm('Replace all current data with this backup?'))return;state=data;save();render();toast('Backup imported')}catch{toast('Invalid backup file')}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
